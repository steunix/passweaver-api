# Success response
status:
  type: string
  enum: [ "success", "failed" ]

infosuccess:
  description: Info are returned
  content:
    application/json:
      schema:
        type: object
        properties:
          status:
            $ref: '#/status'
          data:
            type: object
            properties:
              users:
                type: integer
                example: 100
                description: Number of users in the database
              items:
                type: integer
                example: 1000
                description: Number of items in the database
              folders:
                type: integer
                example: 500
                description: Number of folders in the database
              version:
                type: string
                example: 1.0.0
                description: Version of PassWeaver API
              cacheSize:
                type: string
                example: 2Mb
                description: Memory occupied by cache
              startup:
                type: string
                example: 2024-01-01 15:10:10
                description: PassWeaver API startup

generatepasswordsuccess:
  description: New password generated
  content:
    application/json:
      schema:
        type: object
        properties:
          status:
            $ref: '#/status'
          data:
            type: object
            properties:
              password:
                type: string
                example: 09a8sd0fh
                description: The generated password

clearcachesuccess:
  description: New password generated
  content:
    application/json:
      schema:
        type: object
        properties:
          status:
            $ref: '#/status'
          data:
            type: object

systemgetreadonly:
  description: Get system readonly mode
  content:
    application/json:
      schema:
        type: object
        properties:
          status:
            $ref: '#/status'
          data:
            type: object
            properties:
              readonly:
                type: boolean
                example: false
                description: Readonly mode status

systemgetlock:
  description: Get system lock status
  content:
    application/json:
      schema:
        type: object
        properties:
          status:
            $ref: '#/status'
          data:
            type: object
            properties:
              locked:
                type: boolean
                example: false
                description: System is locked

edataSuccess:
  description: Enterprise items data are returned
  content:
    application/json:
      schema:
        type: object
        properties:
          status:
            $ref: '#/status'
          data:
            type: object
            properties:
              userid:
                type: string
                example: "1125"
                description: The user ID associated with the enterprise items data
              lastname:
                type: string
                example: "Doe"
                description: The last name of the user associated with the enterprise items data
              firstname:
                type: string
                example: "John"
                description: The first name of the user associated with the enterprise items data
              data:
                type: string
                example: "enterprise_data_here"
                description: The encrypted enterprise items data