# Util parameters

symbols:
  name: symbols
  in: query
  description: Enable (if true) or disable (if false) symbols in password
  required: false
  schema:
    type: string

length:
  name: length
  in: query
  description: The length of the generated password
  required: false
  schema:
    type: integer
    minimum: 1
    maximum: 50
    default: 15

key:
  name: key
  in: query
  description: The base64-encoded key to use for encryption. Avoid reusing the key, use a different key for each request.
  required: true
  schema:
    type: string
    example: "MTkzMTAxNjg2MzkxODUzOTA0OTQxMjc5MTM3Mzc4OTc="